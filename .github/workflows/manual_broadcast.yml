name: Manual Actions (Web Panel in GitHub)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Выберите действие для запуска:'
        required: true
        default: 'check_releases'
        type: choice
        options:
          - 'check_releases'
          - 'check_news'
          - 'publish_compilation'
          - 'publish_patchnote'
          - 'pin_navigator'
          - 'test_bot_connection'
      genre:
        description: 'Тема подборки (только для publish_compilation, оставьте пустым для авто-выбора):'
        required: false
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - 'cyberpunk'
          - 'psychological'
          - 'fantasy'
          - 'romance'
          - 'dark_fantasy'
          - 'isekai'
          - 'classics'
          - 'comedy'

jobs:
  execute-action:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute selected action
        run: |
          ACTION="${{ github.event.inputs.action }}"
          GENRE="${{ github.event.inputs.genre }}"
          echo "Executing action: $ACTION with genre: $GENRE"
          if [ "$ACTION" = "check_releases" ]; then
            python series_announcer.py
          elif [ "$ACTION" = "check_news" ]; then
            python news_announcer.py
          elif [ "$ACTION" = "publish_compilation" ]; then
            if [ "$GENRE" = "auto" ] || [ -z "$GENRE" ]; then
              python compilations_announcer.py
            else
              python compilations_announcer.py --genre="$GENRE"
            fi
          elif [ "$ACTION" = "publish_patchnote" ]; then
            python patchnote_publisher.py
          elif [ "$ACTION" = "pin_navigator" ]; then
            python pinned_navigator.py
          elif [ "$ACTION" = "test_bot_connection" ]; then
            python main.py --test
          fi

      - name: Commit state changes if any
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_episodes.json seen_news.json seen_compilations.json config.json || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Manual action state update [skip ci]"
            git push
          fi
